name: Build macOS (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    env:
      ASSET_NAME: NAI-CasRand-Forge-v1.00-macOS-universal.dmg
      APP_PATH: build/macos/Build/Products/Release/NAI CasRand Forge.app

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --concurrency=1

      - name: Build macOS release
        run: flutter build macos --release

      - name: Validate macOS app
        run: |
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")" = "134"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")" = "io.github.khkjdfkjhdsfakhds.casrandforge.beta"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          MAIN_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/NAI CasRand Forge")"
          APP_ARCHS="$(lipo -archs "$APP_PATH/Contents/Frameworks/App.framework/Versions/A/App")"
          FLUTTER_ARCHS="$(lipo -archs "$APP_PATH/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS")"
          for ARCHS in "$MAIN_ARCHS" "$APP_ARCHS" "$FLUTTER_ARCHS"; do
            grep -qw arm64 <<<"$ARCHS"
            grep -qw x86_64 <<<"$ARCHS"
          done

      - name: Package macOS DMG
        run: |
          STAGING="$RUNNER_TEMP/casrand-forge-dmg"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/NAI CasRand Forge.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "NAI CasRand Forge 1.00" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$ASSET_NAME"
          hdiutil verify "$ASSET_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-stable
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14
