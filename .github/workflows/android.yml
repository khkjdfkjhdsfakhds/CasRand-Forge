name: Build Android (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ASSET_NAME: CasRand-Forge-v0.9.2-beta.3-Android.apk

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "$ASSET_NAME"

      - name: Validate Android package
        run: |
          unzip -t "$ASSET_NAME" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$ASSET_NAME"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$ASSET_NAME")"
          grep -Fq "package: name='io.github.khkjdfkjhdsfakhds.casrandforge.beta' versionCode='3' versionName='0.9.2'" <<<"$BADGING"
          grep -Fq "application-label:'CasRand Forge Beta'" <<<"$BADGING"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-beta
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14
