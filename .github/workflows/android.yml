name: Build Android (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-supported-desktop:
    # Desktop filesystem/dialog tests require a supported desktop host.
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --concurrency=1 --enable-vmservice

  build-android:
    needs: test-supported-desktop
    runs-on: ubuntu-latest
    env:
      ASSET_NAME: NAI-CasRand-Forge-v1.00-Android.apk

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.CASRAND_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CASRAND_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.CASRAND_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CASRAND_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "$ASSET_NAME"

      - name: Validate Android package
        run: |
          unzip -t "$ASSET_NAME" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$ASSET_NAME"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$ASSET_NAME")"
          grep -Fq "package: name='io.github.khkjdfkjhdsfakhds.casrandforge.beta' versionCode='134' versionName='1.0.0'" <<<"$BADGING"
          grep -Fq "application-label:'NAI CasRand Forge'" <<<"$BADGING"
          grep -Fq "certificate SHA-256 digest: aa180c392642bf83b47eac1b7ec6756b6e0cefe2b4443ac8e1e22b3a24c31b3e" < <("$APKSIGNER" verify --verbose --print-certs "$ASSET_NAME")

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-stable
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14
