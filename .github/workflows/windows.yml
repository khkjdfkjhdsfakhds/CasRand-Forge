name: Build Windows (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # super_native_extensions 0.8.x still uses the VS 2022 coroutine headers.
    runs-on: windows-2022
    env:
      ASSET_NAME: CasRand-Forge-v0.9.3-beta.1-Windows-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: powershell
        run: |
          $archivePath = Join-Path $PWD $env:ASSET_NAME
          tar.exe -a -c -f $archivePath -C "build\windows\x64\runner\Release" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Windows package
        shell: powershell
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\CasRandForgeBeta.exe")) {
            throw "CasRandForgeBeta.exe is missing from the release directory"
          }
          tar.exe -t -f "$env:ASSET_NAME" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14
