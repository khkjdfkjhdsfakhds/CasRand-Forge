name: Build Windows Beta

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ASSET_NAME: CasRand-Forge-v0.9.2-beta.1-Windows-x64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: powershell
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$env:ASSET_NAME" -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 14
